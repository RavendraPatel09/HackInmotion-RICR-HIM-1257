services:
  - type: web
    name: nagarsathi-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: Backend
    buildCommand: |
      pip install --upgrade pip && pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nagarsathi-db
          property: connectionURI
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@nagarsathi.gov.in
      - key: SMTP_FROM_NAME
        value: NagarSathi
      - key: CORS_ORIGINS
        value: '["https://hackinmotion-ricr-him-1257.vercel.app","http://localhost:5173"]'
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: nagarsathi-db
    plan: free
    databaseName: nagarsathi
    user: nagarsathi_user
